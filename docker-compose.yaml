

services:
  client:
    container_name: 9ralibre-client
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    env_file:
      - ./client/.env
    networks:
      - app-network

  server:
    container_name: 9ralibre-server
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    env_file:
      - ./server/.env.production
    networks:
      - app-network

  mongodb:
    container_name: 9ralibre-mongodb
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - db-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: