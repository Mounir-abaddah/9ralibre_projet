name: Secure CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  client:
    name: Client (lint + build + docker)
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_OAUTH_URL: ${{ secrets.VITE_OAUTH_URL }}
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint 

      - name: Run tests
        run: pnpm run --if-present test

      - name: Build client
        run: pnpm run build

      - name: Build Docker image
        run: docker build -t 9ralibre-client .

  server:
    name: Server (install + syntax + docker)
    runs-on: ubuntu-latest
    env:
      DOTENV_CONFIG_QUIET: ${{ secrets.DOTENV_CONFIG_QUIET }}
      EMAIL_CLIENT: ${{ secrets.EMAIL_CLIENT }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MONGO_URL: ${{ secrets.MONGO_URL }}
      PASSWORD_CLIENT: ${{ secrets.PASSWORD_CLIENT }}
      PORT: ${{ secrets.PORT }}
    
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: node --check index.js

      - name: Run tests
        run: pnpm run --if-present test

      - name: Build Docker image
        run: docker build -t 9ralibre-server .

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create client .env
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > client/.env
          echo "VITE_OAUTH_URL=${{ secrets.VITE_OAUTH_URL }}" >> client/.env

      - name: Create server .env.production
        run: |
          echo "DOTENV_CONFIG_QUIET=${{ secrets.DOTENV_CONFIG_QUIET }}" > server/.env.production
          echo "EMAIL_CLIENT=${{ secrets.EMAIL_CLIENT }}" >> server/.env.production
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> server/.env.production
          echo "GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" >> server/.env.production
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> server/.env.production
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> server/.env.production
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> server/.env.production
          echo "MONGO_URL=${{ secrets.MONGO_URL }}" >> server/.env.production
          echo "PASSWORD_CLIENT=${{ secrets.PASSWORD_CLIENT }}" >> server/.env.production
          echo "PORT=${{ secrets.PORT }}" >> server/.env.production

      - name: Validate docker-compose
        run: docker compose config

      - name: Build full stack
        run: docker compose build

  deploy:
      runs-on: ubuntu-latest
      needs: [client, server]

      steps:
        - name: Deploy to VPS via SSH
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.VPS_IP }}
            username: root
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              set -e
                cd ~

                docker login -u mounirsudiste -p ${{ secrets.DOCKERHUB_TOKEN }}

                docker pull mounirsudiste/9ralibre-client:latest
                docker pull mounirsudiste/9ralibre-server:latest

                docker stop client || true
                docker stop server || true

                docker rm client || true
                docker rm server || true

                docker run -d --name client -p 5173:5173 \
                  -e VITE_API_URL=${{ secrets.VITE_API_URL }} \
                  -e VITE_OAUTH_URL=${{ secrets.VITE_OAUTH_URL }} \
                  mounirsudiste/9ralibre-client:latest

                docker run -d --name server -p 5000:5000 \
                  -e DOTENV_CONFIG_QUIET=${{ secrets.DOTENV_CONFIG_QUIET }} \
                  -e EMAIL_CLIENT=${{ secrets.EMAIL_CLIENT }} \
                  -e FRONTEND_URL=${{ secrets.FRONTEND_URL }} \
                  -e GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }} \
                  -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
                  -e GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
                  -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                  -e MONGO_URL=${{ secrets.MONGO_URL }} \
                  -e PASSWORD_CLIENT=${{ secrets.PASSWORD_CLIENT }} \
                  -e PORT=${{ secrets.PORT }} \
                  mounirsudiste/9ralibre-server:latest