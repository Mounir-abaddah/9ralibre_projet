name: Secure CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  client:
    name: Client (lint + build + docker)
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_OAUTH_URL: ${{ secrets.VITE_OAUTH_URL }}
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint 

      - name: Run tests
        run: pnpm run --if-present test

      - name: Build client
        run: pnpm run build

      - name: Build Docker image
        run: docker build -t 9ralibre-client .

  server:
    name: Server (install + syntax + docker)
    runs-on: ubuntu-latest
    env:
      DOTENV_CONFIG_QUIET: ${{ secrets.DOTENV_CONFIG_QUIET }}
      EMAIL_CLIENT: ${{ secrets.EMAIL_CLIENT }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MONGO_URL: ${{ secrets.MONGO_URL }}
      PASSWORD_CLIENT: ${{ secrets.PASSWORD_CLIENT }}
      PORT: ${{ secrets.PORT }}
    
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: node --check index.js

      - name: Run tests
        run: pnpm run --if-present test

      - name: Build Docker image
        run: docker build -t 9ralibre-server .

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config

      - name: Build full stack
        run: docker compose build